site_name: pm
site_description: Run a program and frame it — before/after actions, watchdog, Windows
site_url: https://davidp57.github.io/process-monitor/
repo_url: https://github.com/davidp57/process-monitor
repo_name: davidp57/process-monitor
docs_dir: doc
edit_uri: blob/main/doc/

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

# With --strict, every warning fails the build: a broken anchor or a page
# left out of the nav is a red CI, not a dead link on the site.
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn

markdown_extensions:
  - toc:
      permalink: true
  - attr_list
  - admonition
  - pymdownx.superfences

plugins:
  - search:
      lang:
        - fr
        - en
  - i18n:
      docs_structure: suffix
      languages:
        - locale: fr
          default: true
          name: Français
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Accueil: Home
            Utiliser pm: Using pm
            "L'icône de notification": The notification icon
            Comment pm suit un programme: How pm follows a program
            Référence: Reference
            Migration depuis la 1.x: Migrating from 1.x
            Dépannage: Troubleshooting

extra:
  version:
    provider: mike

nav:
  - Accueil: index.md
  - Installation: installation.md
  - Utiliser pm:
      - pm run: run.md
      - pm watch: watch.md
      - "L'icône de notification": tray.md
      - Comment pm suit un programme: tracking.md
  - Référence:
      - Configuration: configuration.md
      - Migration depuis la 1.x: migration.md
  - Dépannage: troubleshooting.md
