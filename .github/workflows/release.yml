name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...
      - name: Build pm.exe
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o dist/pm.exe ./cmd/pm
          ./dist/pm.exe version
      - name: Publish the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s RELEASE_NOTES.md || { echo "RELEASE_NOTES.md missing or empty"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/pm.exe --title "pm ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md
