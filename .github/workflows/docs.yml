name: Docs

# Publishes the documentation site on GitHub Pages (gh-pages branch), with
# mike keeping one copy per version: "dev" follows main, a vX.Y.Z tag adds
# that version and moves "latest" (the site's default) to it.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # mike commits to gh-pages
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      - name: Git identity for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Deploy dev
        if: github.ref_type == 'branch'
        run: |
          mike deploy --push dev
          # Until a first release exists, the site root shows dev.
          if ! mike list | grep -q latest; then mike set-default --push dev; fi
      - name: Deploy the release
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          mike deploy --push --update-aliases "$version" latest
          mike set-default --push latest
