# Process Monitor Configuration Example
# Copy this file to config.yaml and modify the values as needed.
# All options are optional except process_name and executable.

# Required: Process name to monitor (e.g., "notepad.exe", "firefox")
process_name: "myapp.exe"

# Required: Path to executable to launch when process is not found
executable: "/path/to/your/executable"

# Optional: Check interval in seconds (how often to check if process is running)
# Default: 0.5
interval: 0.5

# Optional: Delay in seconds after launching before resuming checks
# Useful for applications that take time to start
# Default: 2.0
startup_delay: 2.0

# Optional: Capture STDOUT/STDERR from the launched process
# When true, output will be displayed in TUI or logged to file
# Default: false
capture_output: false

# Optional: Log file path for captured output
# Only used when capture_output is true
# If not specified, output is only shown in TUI
# Default: none
output_log: "process_output.log"

# Optional: Working directory for the launched process
# Default: current directory
working_dir: "/path/to/working/directory"

# Optional: Use TUI (Terminal User Interface) mode
# When false, runs in headless mode
# Default: true
tui: true

# Optional: Enable verbose logging
# Default: false
verbose: false

# Optional: Kill existing processes with same name before launching
# Useful to ensure clean startup
# Default: false
kill_existing: false

# Optional: Automatically relaunch process when not found
# When false, only launches once and stops monitoring
# Default: true
monitor_process: true

# Optional: Path to lock file to wait for after launching
# Process monitor will wait until this file exists before considering launch complete
# Useful for applications that create lock files on startup
lock_file: "/path/to/lock/file"

# Optional: List of file copies to perform before launching the process
# Each item should have 'source' and 'destination' keys
# Useful for copying configuration files or dependencies
initial_file_copies:
  - source: "/path/to/source/file1"
    destination: "/path/to/dest/file1"
  - source: "/path/to/source/file2"
    destination: "/path/to/dest/file2"

# Optional: List of file copies to perform after the process stops
# Each item should have 'source' and 'destination' keys
# Useful for backing up logs or saving state
final_file_copies:
  - source: "/path/to/log/file"
    destination: "/path/to/backup/log/file"

# Optional: Delay in seconds before exiting the application
# Default: 0.0
exit_delay: 0.0

# Optional: Wait for keypress before exiting
# Useful for keeping the terminal window open to see final output
# Default: false
wait_keypress: false

# Optional: Enable automatic cleanup of old log files on startup
# When enabled, keeps only the most recent log files
# Default: false
log_cleanup_enabled: false

# Optional: Number of recent log files to keep when cleanup is enabled
# Applies to both process monitor logs and process output logs
# Default: 3
log_cleanup_keep_count: 3